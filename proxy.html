<!DOCTYPE html>
<html>
<head>
  <title>Doomsday Proxy</title>
  <script src="https://cdn.jsdelivr.net/npm/@titaniumnetwork-dev/ultraviolet@latest/dist/uv.bundle.js"></script>
</head>
<body>
  <div id="uv-container"></div>
  <script>
    const uv = new UVClient({
      prefix: '/service/',  // Match your backend config
      bundle: 'https://cdn.jsdelivr.net/npm/@titaniumnetwork-dev/ultraviolet@latest/dist/uv.bundle.js',
      config: {
        prefix: '/service/',
        bare: 'https://sramjet-test.onrender.com/bare/',  // Your backend bare server
        encodeUrl: Ultraviolet.codec.xor.encode,
        decodeUrl: Ultraviolet.codec.xor.decode
      }
    });

    // Navigate to a URL through the proxy
    function navigate(url) {
      uv.navigate(url);
    }

    // Example: navigate to a blocked site
    // navigate('https://example.com');
  </script>
</body>
</html>
